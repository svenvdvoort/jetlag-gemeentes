<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Gemeentejacht</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Shown instead of the app if setup/loading fails. -->
    <div id="fatal-error" class="fatal-error" hidden></div>

    <div id="app" class="app">
      <header class="topbar">
        <div class="topbar__brand">
          <img
            class="topbar__logo"
            src="img/jetlag.png"
            alt="Jetlag"
            width="463"
            height="149"
          />
          <h1 class="topbar__title">Gemeentejacht</h1>
        </div>
        <button
          id="refresh-btn"
          type="button"
          class="icon-btn"
          aria-label="Refresh board"
          title="Refresh board"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"
            />
          </svg>
        </button>
      </header>

      <div class="score-bar">
        <div id="score-chips" class="score-chips"></div>
      </div>

      <main class="map-wrap">
        <div id="map" class="map"></div>
      </main>

      <section id="cards-panel" class="cards-panel">
        <button
          id="cards-panel-handle"
          type="button"
          class="cards-panel__handle"
        >
          <span class="cards-panel__grip" aria-hidden="true"></span>
          <span id="cards-count" class="cards-panel__count">0 cards</span>
        </button>
        <div id="cards-list" class="cards-list"></div>
      </section>

      <!-- Sits below the cards panel while any team is discarding.
           Nothing on the board goes away for it - the deck and the map are
           both still readable, just not playable. Both the text and the
           button label depend on whether we're the team discarding or the
           one waiting, so syncFreezeState() fills them in; what's here is
           the "we're discarding" wording. -->
      <div id="discard-nag" class="discard-nag" hidden>
        <p id="discard-nag-text" class="discard-nag__text">
          You need to discard a card. The board is frozen until you pick one.
        </p>
        <button
          id="discard-nag-btn"
          type="button"
          class="btn btn--danger discard-nag__btn"
        >
          Discard a card
        </button>
      </div>
    </div>

    <div id="modal-overlay" class="modal-overlay" hidden>
      <div id="modal-sheet" class="modal-sheet" role="dialog" aria-modal="true" tabindex="-1">
        <div id="modal-content"></div>
      </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/kml-parser.js"></script>
    <script src="js/gemeente-shapes.js"></script>
    <script src="js/state.js"></script>
    <script src="js/map-view.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
