<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Gemeentejacht</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Links from before the board moved to board.html still point here with
      // ?game=&team= on them - send those straight through. Inline in <head>
      // so it happens before the join form is ever painted.
      (function () {
        const params = new URLSearchParams(window.location.search);
        if (params.get("game") && params.get("team")) {
          window.location.replace("board.html" + window.location.search);
        }
      })();
    </script>
  </head>
  <body>
    <main class="join">
      <img
        class="join__logo"
        src="img/jetlag.png"
        alt="Jetlag"
        width="463"
        height="149"
      />
      <h1 class="join__title">Gemeentejacht</h1>
      <p class="join__subtitle">Pick your game and team to open the board.</p>

      <div id="join-error" class="modal-error" hidden></div>

      <div class="modal-field">
        <label for="join-game">Game</label>
        <select id="join-game" disabled></select>
      </div>

      <div class="modal-field" role="group" aria-labelledby="join-team-label">
        <span id="join-team-label" class="join__label">Team</span>
        <div id="join-teams" class="discard-list"></div>
      </div>

      <div class="modal-actions">
        <button id="join-btn" type="button" class="btn btn--primary" disabled>
          Open board
        </button>
      </div>

      <p class="join__footer">
        Starting a new game?
        <a class="join__link" href="create.html">Create one</a>.
      </p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/join.js"></script>
  </body>
</html>
